name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python unit and local integration tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -v
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Whitespace
        run: git diff --check
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
          GOWORK: 'off'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint workflows and local Action metadata
        env:
          ACTIONLINT: ${{ runner.temp }}/actionlint-bin/actionlint
        run: '"${ACTIONLINT}" .github/workflows/ci.yml examples/ordo-review-path.yml'
      # actionlint discovers action.yml through this reference. It is never run;
      # these checks are not an E2E test of a consumer pull request.
      - name: Local metadata reference for actionlint
        if: ${{ false }}
        uses: ./
